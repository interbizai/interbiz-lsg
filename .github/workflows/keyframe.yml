name: Generate hero keyframe

on:
  workflow_dispatch:
  push:
    branches:
      - claude/hero-video-background-ol00j5
    paths:
      - scripts/keyframe.py
      - .github/workflows/keyframe.yml

permissions:
  contents: write

concurrency: keyframe

jobs:
  keyframe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Generate candidates
        run: python3 scripts/keyframe.py

      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          git diff --staged --quiet || { git commit -m "Add hero keyframe candidates"; git push; }
