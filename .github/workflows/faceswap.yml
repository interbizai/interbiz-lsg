name: Face swap hero video

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: faceswap

jobs:
  swap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install python deps
        run: |
          pip install --quiet "numpy<2" Cython
          pip install --quiet opencv-python-headless onnxruntime insightface tqdm requests

      - name: Run face swap
        env:
          VIDEO_URL: https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_115001_bcdaa3b4-03de-47e7-ad63-ae3e392c32d4.mp4
          FACE_URL: https://raw.githubusercontent.com/interbizai/interbiz-lsg/3922a2a0519ed1cf6b05cc6b01d748c14c1a887d/reference_person.jpg
        run: python scripts/faceswap.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/asme-hero.mp4
          git commit -m "Add face-swapped hero background video"
          git push
