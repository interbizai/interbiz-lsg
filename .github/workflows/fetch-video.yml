name: Fetch hero video

on:
  push:
    branches:
      - claude/hero-video-background-ol00j5
    paths:
      - scripts/video_url.txt

permissions:
  contents: write

concurrency: fetch-video

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Download and normalize video
        run: |
          URL=$(tr -d '[:space:]' < scripts/video_url.txt)
          echo "downloading: $URL"
          curl -L -A "Mozilla/5.0" --max-time 600 -o src_video "$URL"
          test "$(stat -c%s src_video)" -gt 300000
          ffmpeg -v error -y -i src_video \
            -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080" \
            -r 24 -c:v libx264 -crf 19 -pix_fmt yuv420p -movflags +faststart -an \
            public/asme-hero.mp4
          ls -l public/asme-hero.mp4

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/asme-hero.mp4
          git diff --staged --quiet || { git commit -m "Update hero background video from provided URL"; git push; }
